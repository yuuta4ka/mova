<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Подключение Mova</title>
    <style>
      :root { color-scheme: dark; font-family: Manrope, Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      body { min-height:100vh;margin:0;color:#eef3f5;background:#0d1118;overflow:hidden; }
      .setup-content { min-height:100vh;display:grid;place-items:center;padding:32px;background:radial-gradient(800px 580px at 18% 12%,rgba(88,206,189,.1),transparent 65%),radial-gradient(700px 500px at 90% 90%,rgba(140,108,225,.08),transparent 65%); }
      main { width:min(460px,100%);padding:32px;background:#151a23;border:1px solid rgba(228,237,250,.08);border-radius:22px;box-shadow:0 24px 70px rgba(0,0,0,.34); }
      .logo { display:block;width:58px;height:58px;margin-bottom:20px; }
      .logo img { display:block;width:100%;height:100%;object-fit:contain; }
      h1 { margin:0;font-size:29px;letter-spacing:-.045em; }
      p { margin:10px 0 26px;color:#8d99a8;font-size:14px;line-height:1.55; }
      label { display:grid;gap:8px;color:#b8c0ca;font-size:12px;font-weight:700; }
      input { width:100%;height:50px;padding:0 14px;color:#f1f5f6;background:rgba(3,7,12,.48);border:1px solid rgba(228,237,250,.11);border-radius:14px;outline:0;font-size:14px; }
      input:focus { border-color:rgba(93,226,211,.42);box-shadow:0 0 0 4px rgba(93,226,211,.08); }
      button { width:100%;height:50px;margin-top:16px;color:#10201f;background:linear-gradient(145deg,#9cece0,#59cebd);border:0;border-radius:14px;font-weight:850;cursor:pointer; }
      button:disabled { opacity:.6;cursor:wait; }
      #error { min-height:18px;margin:11px 2px 0;color:#ff9aaa;font-size:12px; }
      small { display:block;margin-top:18px;color:#667281;font-size:11px;line-height:1.5; }
      .desktop-titlebar { display:none; }
      body.is-windows-shell { display:grid;grid-template-rows:38px minmax(0,1fr); }
      body.is-windows-shell .setup-content { min-height:0;height:100%; }
      body.is-windows-shell .desktop-titlebar { display:flex;align-items:center;justify-content:space-between;height:38px;color:#d9dce3;background:#11151d;border-bottom:1px solid rgba(255,255,255,.055);user-select:none;-webkit-app-region:drag;app-region:drag; }
      .desktop-titlebar__identity { display:flex;align-items:center;gap:8px;padding-left:12px; }
      .desktop-titlebar__identity>span { display:grid;place-items:center;width:22px;height:22px;color:#111820;background:#74d9cb;border-radius:7px;font-size:10px;font-weight:900; }
      .desktop-titlebar__identity>strong { font-size:12px;font-weight:720;letter-spacing:-.02em; }
      .desktop-titlebar__controls { display:flex;align-self:stretch;-webkit-app-region:no-drag;app-region:no-drag; }
      .desktop-titlebar__controls>button { display:grid;place-items:center;width:46px;height:100%;margin:0;padding:0;color:#cdd0d7;background:transparent;border:0;border-radius:0;box-shadow:none;cursor:default;-webkit-app-region:no-drag;app-region:no-drag; }
      .desktop-titlebar__controls>button:hover { color:#fff;background:rgba(255,255,255,.09); }
      .desktop-titlebar__controls>button:active { background:rgba(255,255,255,.14); }
      .desktop-titlebar__controls>button.is-close:hover { background:#c42b1c; }
      .desktop-titlebar__controls>button.is-close:active { background:#a91f13; }
      .desktop-titlebar__controls>button:focus-visible { outline:1px solid rgba(179,164,242,.9);outline-offset:-2px; }
      .desktop-titlebar__controls svg { width:12px;height:12px;overflow:visible;fill:none;stroke:currentColor;stroke-width:1;stroke-linecap:square;stroke-linejoin:miter; }
      .desktop-titlebar__restore { display:none; }
      body.is-maximized .desktop-titlebar__maximize { display:none; }
      body.is-maximized .desktop-titlebar__restore { display:block; }
    </style>
  </head>
  <body>
    <header class="desktop-titlebar" aria-label="Заголовок окна Mova">
      <div class="desktop-titlebar__identity" aria-hidden="true"><span>M</span><strong>Mova</strong></div>
      <div class="desktop-titlebar__controls">
        <button type="button" data-window-action="minimize" aria-label="Свернуть"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 8.5h8" /></svg></button>
        <button type="button" data-window-action="maximize" aria-label="Развернуть окно">
          <svg class="desktop-titlebar__maximize" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 2.5h7v7h-7z" /></svg>
          <svg class="desktop-titlebar__restore" viewBox="0 0 12 12" aria-hidden="true"><path d="M3.5 4.5v-2h6v6h-2M2.5 4.5h5v5h-5z" /></svg>
        </button>
        <button type="button" class="is-close" data-window-action="close" aria-label="Закрыть"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="m2.5 2.5 7 7m0-7-7 7" /></svg></button>
      </div>
    </header>
    <div class="setup-content">
      <main>
        <div class="logo"><img src="./assets/icon.png" alt="Mova" /></div>
        <h1>Подключить Mova</h1>
        <p>Введите публичный адрес вашей Mova на Amvera. Он сохранится только на этом компьютере.</p>
        <form id="form">
          <label>
            Адрес сервера
            <input id="url" type="url" inputmode="url" placeholder="https://mova.example.com" required autofocus />
          </label>
          <button id="submit" type="submit">Открыть Mova</button>
          <div id="error" role="alert"></div>
        </form>
        <small>Адрес должен начинаться с https://. Позже его можно изменить через меню Mova.</small>
      </main>
    </div>
    <script>
      const shell = window.movaDesktopShell;
      if (shell?.platform === 'win32') {
        const titlebar = document.querySelector('.desktop-titlebar');
        const maximize = document.querySelector('[data-window-action="maximize"]');
        const updateMaximized = (value) => {
          document.body.classList.toggle('is-maximized', value);
          maximize.setAttribute('aria-label', value ? 'Восстановить окно' : 'Развернуть окно');
        };
        document.body.classList.add('is-windows-shell');
        document.querySelector('[data-window-action="minimize"]').addEventListener('click', shell.minimize);
        maximize.addEventListener('click', shell.toggleMaximize);
        document.querySelector('[data-window-action="close"]').addEventListener('click', shell.close);
        titlebar.addEventListener('dblclick', (event) => {
          if (!event.target.closest('.desktop-titlebar__controls')) shell.toggleMaximize();
        });
        shell.isMaximized().then(updateMaximized);
        shell.onMaximizedChange(updateMaximized);
      }
      const form = document.querySelector('#form');
      const input = document.querySelector('#url');
      const button = document.querySelector('#submit');
      const error = document.querySelector('#error');
      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        error.textContent = '';
        button.disabled = true;
        try {
          await window.movaDesktop.saveUrl(input.value);
        } catch (reason) {
          error.textContent = (reason?.message || 'Не удалось сохранить адрес.').replace(/^Error invoking remote method .*?: Error: /, '');
          button.disabled = false;
        }
      });
    </script>
  </body>
</html>
